metadata:
  name: Crafts
  description: >
    Every craft in the game. Recipes take inputs and produce an output at a
    station. Multiple recipes with the same output are crafting alternatives -
    the player picks the one that fits their resources or tech level.
  version: 1
  recipe_types:
    alloy: Transform one or more materials into another material.
    assemble: Require a station to build a pattern from its parts. Patterns
              without an assembly recipe can be crafted by hand.

stations:
  crafting_table:
    name: Crafting Table
    tier: 0
    type: hand
    note: Basic assembly bench - no fuel required.

  campfire:
    name: Campfire
    tier: 0
    type: furnace
    fuels: [wood, coal]
    note: Primitive smelting. Low yield but needs no tech.

  smeltery:
    name: Smeltery
    tier: 1
    type: furnace
    fuels: [coal, wood]
    note: Melts and mixes metals.

  bloomery:
    name: Bloomery
    tier: 2
    type: furnace
    fuels: [coal]
    note: Refines iron into steel.

  blast_furnace:
    name: Blast Furnace
    tier: 3
    type: furnace
    fuels: [coal]
    note: High-heat alloying. Requires bellows.

recipes:

  # =========================================================== BRONZE
  # Two recipes - one standard, one primitive. Both produce the same bronze.
  bronze_standard:
    type: alloy
    output: bronze
    output_qty: 1
    inputs: { copper: 3, tin: 1 }
    station: smeltery
    note: 3:1 copper-tin - the historical standard.

  bronze_primitive:
    type: alloy
    output: bronze
    output_qty: 1
    inputs: { copper: 4, tin: 1 }
    station: campfire
    note: Lower yield, but no smeltery needed.

  # ============================================================ BRASS
  brass_standard:
    type: alloy
    output: brass
    output_qty: 1
    inputs: { copper: 2, iron: 1 }
    station: smeltery

  # ============================================================ STEEL
  # Two alternatives based on available fuel.
  steel_coal:
    type: alloy
    output: steel
    output_qty: 1
    inputs: { iron: 2, coal: 2 }
    station: bloomery
    note: Standard - coal fuel.

  steel_charcoal:
    type: alloy
    output: steel
    output_qty: 1
    inputs: { iron: 2, wood: 2 }
    station: bloomery
    note: Charcoal alternative - burns slower but works anywhere trees grow.

  # ======================================================== ALUMINIUM
  aluminium_standard:
    type: alloy
    output: aluminium
    output_qty: 1
    inputs: { coal: 3, iron: 2 }
    station: smeltery
    note: Carbon reduces iron oxide to metal.

  # ============================================================ INVAR
  invar_standard:
    type: alloy
    output: invar
    output_qty: 1
    inputs: { iron: 3, nickel: 2 }
    station: smeltery

  # ========================================================= ELECTRUM
  electrum_standard:
    type: alloy
    output: electrum
    output_qty: 1
    inputs: { magnetite: 2, gold: 1 }
    station: smeltery
    note: Gold charged with magnetite - magnetic rather than silvery.

  # ======================================================== ROSE GOLD
  rose_gold_standard:
    type: alloy
    output: rose_gold
    output_qty: 1
    inputs: { copper: 3, gold: 1 }
    station: smeltery

  # ========================================================= TITANIUM
  titanium_standard:
    type: alloy
    output: titanium
    output_qty: 1
    inputs: { iron: 2, aluminium: 1 }
    station: blast_furnace
    note: >
      Aluminium is itself an alloy, so titanium's full cost is
      2 Iron + (3 Coal + 2 Iron) = 4 Iron + 3 Coal.
  blooderium_standard:
    type: alloy
    output: blooderium
    output_qty: 1
    inputs: { iron: 3, leather: 2 }
    station: bloomery
    note: Iron quenched in animal hide - the leather's blood binds to the metal.

  carbonado_standard:
    type: alloy
    output: carbonado
    output_qty: 1
    inputs: { diamond: 2, obsidian: 2 }
    station: blast_furnace
    note: The apex alloy - diamond and obsidian fused in a blast furnace.

  # ========================================================= ASSEMBLY
  # Patterns that require a station to build. Patterns without an entry
  # here can be crafted by hand.

  short_sword_assembly:
